[project]
name = "frontiersignal"
version = "0.1.0"
description = "A local, traceable AI intelligence workspace"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "apscheduler>=3.11,<4", "feedparser>=6.0.12,<7",
  "aiohttp>=3.12,<4", "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5",
  "simhash==2.1.2", "pgvector>=0.4,<1", "platformdirs>=4,<5",
  "protego>=0.4,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "aiosqlite>=0.21,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/frontiersignal"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
